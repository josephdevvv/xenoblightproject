<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Xenoblight</title>
    <meta name="description" content="Xenoblight - a dark fantasy isometric pixel-art RPG." />
    <meta name="theme-color" content="#060608" />
    <!-- Installed (Add to Home Screen): full screen, the page under the status bar / cutout (the HUD keeps to the safe area) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xenoblight" />
    <!-- Browser tab favicon: multi-size ICO (16-256 px) -->
    <link rel="icon" href="/icons/XENOBLIGHT_App.ico" sizes="any" />
    <!-- Home-screen / app icons -->
    <link rel="apple-touch-icon" href="/icons/XENOBLIGHT_256x256.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060608;
      }
      /* Phaser's Scale Manager (FIT + CENTER_BOTH) handles sizing and centering;
         extra CSS centering here would offset the DOM layer used by the name input. */
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #game-container canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* Mobile (html.touch, set by src/platform/TouchPage.ts - never on desktop): no scrolling, zooming, selection or
         tap callouts; the game covers the whole screen edge to edge (dynamic viewport: browser bars, installed app),
         under the notch / cutout too - the in-game UI keeps to the safe areas itself (src/platform/SafeArea.ts). */
      html.touch,
      html.touch body {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      html.touch,
      html.touch body {
        height: 100%;
        height: 100dvh;
      }
      html.touch #game-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* measures env(safe-area-inset-*) for the game (TouchPage) */
      #safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
